name: Sonora Music App CI

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "music-app/**"
      - ".github/workflows/music-app-ci.yml"
  pull_request:
    paths:
      - "music-app/**"
      - ".github/workflows/music-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: music-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: music-app/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
